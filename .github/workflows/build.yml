name: Build Windows executable

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: python -m PyInstaller --name=detarame --clean --noconfirm --onefile --icon=./icon.ico --distpath ./releases ./cli.py

      - name: Publish rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "continuous"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "Detarame (continuous)"
            gh release upload $tag releases/detarame.exe --clobber
          } else {
            gh release create $tag releases/detarame.exe --target $env:GITHUB_SHA --title "Detarame (continuous)" --notes "Automatically built from the latest push." --prerelease
          }